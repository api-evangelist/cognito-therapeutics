aid: cognito-therapeutics
name: Cognito Therapeutics
description: 'Cognito Therapeutics is a clinical-stage neurotechnology company in Cambridge,
  Massachusetts, founded in 2016 out of MIT research by Ed Boyden and Li-Huei Tsai into
  the link between gamma-frequency neural oscillations and Alzheimer''s disease progression.
  Its lead investigational product, Spectris, is a non-invasive at-home neuromodulation
  device that delivers synchronized 40Hz light and sound stimulation through a headset
  and glasses for one hour daily, evoking gamma activity to slow cognitive and functional
  decline in mild-to-moderate Alzheimer''s disease. Spectris AD received FDA Breakthrough
  Device Designation in 2021, and the company closed an oversubscribed $105M Series C
  in March 2026 led by Morningside Ventures. Cognito Therapeutics is a medical device
  and therapeutics company: it publishes a corporate and clinical-information website
  and no public developer program, API, SDK, or machine-readable contract of any kind.'
